<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seráfico</title>

     <style>
           @font-face {
    font-family: 'Invite';
    src: url("Invite.otf") format("opentype");
}
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("Background1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Invite', sans-serif;
        }
        
        .pagina {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }

        .imagem-principal {
            width: min(60vw, 400px);
            height: min(60vw, 400px);
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }

       .texto {
            margin-top: 30px;
            color: white;
            font-size: 22px;
            line-height: 1.6;
            font-weight: 200;
            font-family: 'Invite', sans-serif;
        }

        audio {
            display: none;
        }

        .hidden {
            display: none;
            color: yellow;
        }
    </style>
</head>

<body>

    <main class="pagina">

    <img
        class="imagem-principal"
        <img src="teste.png"
        alt="Imagem principal"
    >

    <p class="texto">
        Eu imagino o quão surpreso você está, queria ser uma mosquinha nessas horas.
        De qualquer forma, boa sorte, meu anjo.
    </p>

    <audio id="musica" autoplay loop>
        <source src="From Eden.mp3" type="audio/mpeg">
    </audio>

</main>
    
    <span class="hidden">poliglota</span>
        
    <script>
    const musica = document.getElementById("musica");

    musica.volume = 1.0;

    function iniciarMusica() {
        musica.play().catch(() => {});
    }

    iniciarMusica();

    document.addEventListener("click", iniciarMusica, { once: true });
    document.addEventListener("touchstart", iniciarMusica, { once: true });
    document.addEventListener("keydown", iniciarMusica, { once: true });


    fetch("Casal")
        .then(resposta => {
            if (!resposta.ok) {
                throw new Error("Não foi possível carregar Casal");
            }

            return resposta.arrayBuffer();
        })
        .then(dados => {
            const arquivo = new Blob([dados], {
                type: "image/png"
            });

            const imagem = document.getElementById("imagem-casal");

            imagem.src = URL.createObjectURL(arquivo);
        })
        .catch(erro => {
            console.error("Erro ao carregar a imagem:", erro);
        });
</script>
</body>
</html>
